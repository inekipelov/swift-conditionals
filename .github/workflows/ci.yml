name: CI

on:
  pull_request:

jobs:
  test:
    name: Swift Package Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build Apple platform targets
        run: |
          swift build --build-tests \
            --triple arm64-apple-ios13.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --scratch-path "$RUNNER_TEMP/conditionals-ios" \
            -Xswiftc -warnings-as-errors
          swift build --build-tests \
            --triple arm64-apple-tvos13.0-simulator \
            --sdk "$(xcrun --sdk appletvsimulator --show-sdk-path)" \
            --scratch-path "$RUNNER_TEMP/conditionals-tvos" \
            -Xswiftc -warnings-as-errors
          swift build --build-tests \
            --triple arm64-apple-watchos6.0-simulator \
            --sdk "$(xcrun --sdk watchsimulator --show-sdk-path)" \
            --scratch-path "$RUNNER_TEMP/conditionals-watchos" \
            -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test -q
